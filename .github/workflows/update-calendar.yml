name: Update Tipsport liga team calendars

on:
  # The daily schedule is off: Cloudflare serves a managed challenge to
  # GitHub-hosted runners, so a scheduled run only produces a red X every
  # morning. Scraping now runs on Railway (see README). Re-enable the cron
  # if that changes.
  #   schedule:
  #     - cron: "0 6 * * *"
  workflow_dispatch: {}   # still runnable by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Chromium for Playwright
        # Needed to clear Cloudflare's JS interstitial; the HTTP clients
        # cannot, so without this the run stops at the challenge.
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        id: scrape
        continue-on-error: true
        env:
          # Optional repository variables (Settings -> Variables) to tune the
          # scraper without a code change if the site's edge starts pushing
          # back again. Unset variables expand to "" and fall back to the
          # script's defaults.
          SCRAPER_USER_AGENT: ${{ vars.SCRAPER_USER_AGENT }}
          SCRAPER_DELAY: ${{ vars.SCRAPER_DELAY }}
          SCRAPER_MAX_ATTEMPTS: ${{ vars.SCRAPER_MAX_ATTEMPTS }}
          SCRAPER_IMPERSONATE: ${{ vars.SCRAPER_IMPERSONATE }}
          SCRAPER_FORCE_REQUESTS: ${{ vars.SCRAPER_FORCE_REQUESTS }}
          SCRAPER_BACKEND: ${{ vars.SCRAPER_BACKEND }}
          SCRAPER_CHALLENGE_TIMEOUT: ${{ vars.SCRAPER_CHALLENGE_TIMEOUT }}
          SCRAPER_BROWSER_HEADLESS: ${{ vars.SCRAPER_BROWSER_HEADLESS }}
        run: python3 scripts/update_calendar.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*.ics
          if git diff --cached --quiet; then
            echo "No changes to any team's schedule."
          else
            git commit -m "Update team calendars"
            git push
          fi

      - name: Fail job if scraper had issues
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "Scraper reported issues for one or more teams — see the 'Run scraper' step log above."
          exit 1
